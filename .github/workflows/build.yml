name: Build

on:
  push:
    branches:
      - restricted
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip gradle-8.2-bin.zip
          sudo mv gradle-8.2 /opt/gradle
          echo 'export PATH=$PATH:/opt/gradle/bin' >> ~/.bashrc
          source ~/.bashrc

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper || true  # Игнорируем ошибку, если gradlew уже существует

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
          if-no-files-found: warn

  create_release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifacts from Build
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
          path: artifacts/ubuntu

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: release-${{ github.run_id }}
          artifacts: |
            artifacts/ubuntu/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
